<!DOCTYPE html>
<html>
<head>
<title>CodeAlpha Flashcards</title>
<style>
body{font-family:Arial;text-align:center;background:#eef2ff;padding:20px}
.card{background:white;width:320px;height:200px;margin:20px auto;display:flex;align-items:center;justify-content:center;border-radius:15px;box-shadow:0 4px 10px #aaa;font-size:22px;font-weight:bold;padding:20px;cursor:pointer}
button{padding:10px 20px;margin:5px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer;font-size:16px}
input{padding:10px;margin:5px;width:280px;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>
<h1>CodeAlpha Flashcards 🎴</h1>
<p id="count">1 / 3</p>
<div class="card" id="card" onclick="flip()">What is Flutter?</div>
<button onclick="flip()">Show Answer</button><br><br>
<button onclick="prev()">Previous</button>
<button onclick="next()">Next</button>
<button onclick="del()" style="background:red">Delete</button>
<h3>Add New Card</h3>
<input id="q" placeholder="Enter Question"><br>
<input id="a" placeholder="Enter Answer"><br>
<button onclick="add()">Add Card</button>

<script>
let cards=[
 {q:"What is Flutter?", a:"Flutter is Google's UI toolkit for building apps."},
 {q:"What is Dart?", a:"Dart is the language used by Flutter."},
 {q:"What is Widget?", a:"Everything in Flutter is a Widget."}
];
let index=0, showAns=false;
function update(){
 document.getElementById("card").innerText = showAns ? cards[index].a : cards[index].q;
 document.getElementById("count").innerText = (index+1)+" / "+cards.length;
}
function flip(){ showAns=!showAns; update(); }
function next(){ if(index<cards.length-1){index++; showAns=false; update();} }
function prev(){ if(index>0){index--; showAns=false; update();} }
function del(){ cards.splice(index,1); if(index>=cards.length) index=0; showAns=false; update(); }
function add(){
 let q=document.getElementById("q").value;
 let a=document.getElementById("a").value;
 if(q && a){ cards.push({q,a}); alert("Card Added!"); update(); }
}
update();
</script>
</body>
</html>
